name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Run Pint
        run: composer lint

      - name: Run tests
        run: composer test

  compatibility:
    name: Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10'
            illuminate: '^10.0'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '11'
            illuminate: '^11.0'
            testbench: '^9.0'
          - php: '8.2'
            laravel: '12'
            illuminate: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13'
            illuminate: '^13.0'
            testbench: '^11.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Update dependencies for Laravel ${{ matrix.laravel }}
        run: >
          composer update
          --prefer-dist
          --no-interaction
          --no-progress
          --with "illuminate/console:${{ matrix.illuminate }}"
          --with "illuminate/support:${{ matrix.illuminate }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        run: composer test
